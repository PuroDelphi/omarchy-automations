name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Engine, installer and documentation (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Static analysis
        run: go vet ./...
      - name: Engine tests with race detector
        run: go test -race ./...
      - name: Build runtime
        run: make build
      - name: Installer ownership and rollback tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproducible archive and staging lifecycle
        run: python3 scripts/test-release-package.py
      - name: Prebuilt setup lifecycle and archive safety
        run: python3 scripts/test-setup.py

      - name: Installed AI skill examples without effects
        run: python3 scripts/test-skill-runtime.py
